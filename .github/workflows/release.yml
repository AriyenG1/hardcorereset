name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v1.0.1
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested release artifacts and tagged source
        run: |
          git rev-parse --verify "${RELEASE_TAG}^{commit}"
          git diff --exit-code "$RELEASE_TAG" -- src gradle gradlew gradlew.bat gradle.properties build.gradle settings.gradle
          cd "releases/$RELEASE_TAG"
          sha256sum --check SHA256SUMS
      - name: Publish the tested downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            "releases/$RELEASE_TAG/hardcorereset-${RELEASE_TAG#v}.jar" \
            "releases/$RELEASE_TAG/hardcorereset-${RELEASE_TAG#v}-server-bundle.zip" \
            "releases/$RELEASE_TAG/SHA256SUMS" \
            "releases/$RELEASE_TAG/INSTALL.txt" \
            --title "Hardcore Reset ${RELEASE_TAG#v} - Minecraft 26.3" \
            --notes-file "releases/$RELEASE_TAG/RELEASE_NOTES.md" \
            --verify-tag --latest
