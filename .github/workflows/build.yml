name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fabric-api: ['0.165.0+26.3', '0.165.2+26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./tools/test-controller.sh
      - run: ./gradlew build --no-daemon -Pfabric_api_version=${{ matrix.fabric-api }}
      - uses: actions/upload-artifact@v4
        with:
          name: hardcorereset-fabric-api-${{ matrix.fabric-api }}
          path: |
            build/libs/hardcorereset-*.jar
            !build/libs/*-sources.jar
            README.md
